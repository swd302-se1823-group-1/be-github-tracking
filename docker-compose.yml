services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nest-api
    env_file:
      - .env
    ports:
      - '3000:3000'
    environment:
      # LƯU Ý: host là tên service 'postgres', không phải localhost
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
    depends_on:
      - redis
  redis:
    image: redis:7
    container_name: be-redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - ./redis_data:/data
    command: >
      redis-server 
      --appendonly yes 
      --save 900 1 
      --save 300 10 
      --save 60 1000
volumes:
  redis_data:
