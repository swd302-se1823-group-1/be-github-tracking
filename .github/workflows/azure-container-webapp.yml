name: Build and deploy a container to an Azure Web App

env:
  # 1. Thay bằng tên Web App bạn đã tạo trên Azure
  AZURE_WEBAPP_NAME: 'nhphuong203204' 

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. Đăng nhập vào ACR thay vì GHCR
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 3. Build và Push với tên image khớp với file docker-compose
      - name: Build and push container image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/be-github-tracking:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/be-github-tracking:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 4. Deploy lên Azure bằng Publish Profile
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          # Chỉ định image chính để Azure cập nhật
          images: '${{ secrets.ACR_LOGIN_SERVER }}/be-github-tracking:latest'
